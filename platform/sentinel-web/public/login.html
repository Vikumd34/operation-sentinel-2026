<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Operation Sentinel 2026</title><style>
:root{--h:190;--c:hsl(var(--h) 100% 60%);--bg:#05070d;--tx:#dbe7f5;--mu:#7e8ea6;--ok:#38f5a0;--er:#ff4d6d}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,Segoe UI,sans-serif}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
#glow{position:fixed;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:-1;background:radial-gradient(circle,hsl(var(--h) 100% 55%/.16),transparent 65%)}
.mono{font-family:ui-monospace,Consolas,monospace}
section{min-height:100vh;padding:88px 6vw 60px;max-width:1200px;margin:auto}
nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:18px;align-items:center;padding:12px 6vw;background:#05070dcc;backdrop-filter:blur(6px);border-bottom:1px solid #ffffff12}
nav b{margin-right:auto;letter-spacing:.14em;font-size:13px;color:var(--c)}nav a{color:var(--mu);text-decoration:none;font-size:14px}nav a:hover,nav a:focus{color:#fff}
#score{font-size:13px;color:var(--ok)}
h1{font-size:clamp(2.4rem,7vw,5.2rem);line-height:1;margin:.3em 0;letter-spacing:-.02em}
h1 span{color:var(--c);text-shadow:0 0 28px var(--c)}
h2{font-size:1.9rem;margin:0 0 .3em}
.hero{display:flex;flex-direction:column;justify-content:center}
#term{min-height:7.6em;color:#8fe9ff;font-size:14px;white-space:pre-wrap}
.btn{display:inline-block;background:transparent;color:var(--c);border:1px solid var(--c);padding:12px 26px;font:600 14px ui-monospace,monospace;letter-spacing:.12em;cursor:pointer;border-radius:4px;transition:.2s;text-decoration:none}
.btn:hover,.btn:focus-visible{background:var(--c);color:#001018;box-shadow:0 0 24px var(--c)}
.scroll{margin-top:40px;color:var(--mu);font-size:12px;letter-spacing:.2em;animation:b 1.6s infinite}@keyframes b{50%{transform:translateY(7px)}}
.glass{background:#0c1424b8;border:1px solid #ffffff1a;border-radius:12px;padding:20px;backdrop-filter:blur(8px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin:26px 0}
.card{position:relative;text-align:left;color:inherit;font:inherit;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s;transform-style:preserve-3d}
.card:hover,.card:focus-visible{border-color:var(--c);box-shadow:0 0 28px hsl(var(--h) 100% 50%/.3)}
.card.locked{opacity:.5}.card.solved{border-color:var(--ok)}.card.sel{outline:2px solid var(--c)}
.card small{color:var(--mu)}.tag{float:right;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.t-open{color:var(--c)}.t-solved{color:var(--ok)}.t-locked{color:var(--mu)}
.card:not(:last-child)::after{content:"→";position:absolute;right:-16px;top:50%;color:var(--mu);pointer-events:none}
@media(max-width:700px){.card::after{display:none}}
#det .row{margin:.5em 0}#det .k{color:var(--mu);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
input[type=text],input[type=number]{width:100%;background:#050a14;color:var(--tx);border:1px solid #ffffff2a;border-radius:4px;padding:11px;font:15px ui-monospace,monospace}
input:focus{outline:2px solid var(--c)}
.hint{padding:8px 12px;margin:6px 0;border-left:3px solid var(--c);background:#ffffff08}
#fb{min-height:1.6em;margin-top:10px;font-weight:600}.good{color:var(--ok)}.bad{color:var(--er);animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bar{height:6px;background:#ffffff14;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--ok));transition:width .4s}
.flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.flex>*{flex:1 1 220px}
.swatch{height:150px;border-radius:12px;border:1px solid #ffffff30;transition:background .12s;display:flex;align-items:end;padding:8px;font-size:13px}
.sl{display:grid;grid-template-columns:24px 1fr 56px;gap:10px;align-items:center;margin:8px 0}.sl input[type=range]{width:100%}
#done{display:none;text-align:center;padding-top:20vh}#done.on{display:block}#done h2{font-size:3rem;color:var(--ok);text-shadow:0 0 30px var(--ok)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.note{color:var(--mu);font-size:13px}

body{display:grid;place-items:center;min-height:100vh;padding:24px}
.box{width:min(420px,100%);position:relative}
.box::before{content:"";position:absolute;inset:-1px;border-radius:13px;background:linear-gradient(135deg,var(--c),transparent 40%,hsl(calc(var(--h) + 90) 100% 60%));z-index:-1;opacity:.55}
.tabs{display:flex;margin:18px 0}.tabs button{flex:1;background:none;border:0;border-bottom:2px solid #ffffff1f;color:var(--mu);padding:10px;font:600 13px ui-monospace,monospace;letter-spacing:.12em;cursor:pointer}
.tabs button.on{color:var(--c);border-color:var(--c)}label{display:block;margin:12px 0 4px;font-size:12px;letter-spacing:.1em;color:var(--mu)}
#msg{min-height:1.6em;margin-top:12px;font-weight:600}.btn{width:100%;margin-top:18px}.sub{text-align:center;margin-top:16px}.sub a{color:var(--mu);font-size:14px}
</style></head><body>
<canvas id="bg" aria-hidden="true"></canvas><div id="glow"></div>
<main class="glass box">
 <div class="mono note">DEMO PREVIEW · SLIIT · IE3132 · RESTRICTED LAB ACCESS</div>
 <h1 style="font-size:2.1rem;margin:.2em 0">OPERATION <span>SENTINEL</span></h1>
 <div class="tabs" role="tablist"><button id="t-in" class="on" role="tab" type="button">LOGIN</button><button id="t-up" role="tab" type="button">REGISTER</button></div>
 <label for="u">USERNAME</label><input type="text" id="u" autocomplete="username" maxlength="20" autofocus>
 <label for="p">PASSWORD</label><input type="text" id="p" style="-webkit-text-security:disc" autocomplete="current-password" maxlength="100">
 <button class="btn" id="go" type="button">AUTHENTICATE</button>
 <div id="msg" role="status" aria-live="polite"></div>
 <p class="sub"><a href="/">← Back to the lab</a></p>
</main>
<script>
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;let up=false,M={x:0,y:0};
const bg=$('#bg'),g=bg.getContext('2d');let W,H,P=[];
function size(){W=bg.width=innerWidth;H=bg.height=innerHeight;P=Array.from({length:Math.min(80,W*H/16000|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}))}
addEventListener('resize',size);size();
(function f(){g.clearRect(0,0,W,H);const ox=(M.x-W/2)*.02,oy=(M.y-H/2)*.02;P.forEach((a,i)=>{if(!RM){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1}a.px=a.x+ox*6;a.py=a.y+oy*6;g.fillStyle='hsla(190,100%,70%,.8)';g.fillRect(a.px,a.py,2,2);
for(let k=i+1;k<P.length;k++){const b=P[k],l=Math.hypot(a.px-(b.px||b.x),a.py-(b.py||b.y));if(l<110){g.strokeStyle=`hsla(190,100%,60%,${(1-l/110)*.25})`;g.beginPath();g.moveTo(a.px,a.py);g.lineTo(b.px||b.x,b.py||b.y);g.stroke()}}});requestAnimationFrame(f)})();
addEventListener('pointermove',e=>{M.x=e.clientX;M.y=e.clientY;$('#glow').style.left=M.x+'px';$('#glow').style.top=M.y+'px'});
const tab=u=>{up=u;$('#t-up').classList.toggle('on',u);$('#t-in').classList.toggle('on',!u);$('#p').autocomplete=u?'new-password':'current-password';$('#msg').textContent=''};
$('#t-in').onclick=()=>tab(false);$('#t-up').onclick=()=>tab(true);
async function go(){const m=$('#msg');m.className='';m.textContent='Authenticating…';
 try{const r=await fetch(up?'/api/register':'/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
  username:$('#u').value.trim(),
  password:$('#p').value
})});const j=await r.json();
  if(!r.ok)throw new Error(j.error||r.status);m.className='good';if (up) {
  const loginResponse = await fetch('/api/login', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({
      username: $('#u').value.trim(),
      password: $('#p').value
    })
  });

  const loginResult = await loginResponse.json();

  if (!loginResponse.ok) {
    throw new Error(loginResult.error || 'Automatic login failed');
  }
}m.textContent='✔ Access granted — loading lab…';setTimeout(() => {
  window.location.href = '/dashboard.html';
}, 700)}
 catch(e){m.className='bad';m.textContent='✘ '+e.message}}
$('#go').onclick=go;document.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script></body></html>
