services:
  sentinel-web:
    build: .
    container_name: operation-sentinel-2026
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    volumes:
      - ./data:/app/data
      - ./organiser_only:/app/organiser_only:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped